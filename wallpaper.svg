    <use href="#leaf" transform="translate(60,178) rotate(20)"/>
    <use href="#leaf" transform="translate(120,124) rotate(70) scale(0.8)"/>

    <circle cx="115" cy="160" r="1.8" fill="#C7B8E0"/>
    <circle cx="55" cy="50" r="1.5" fill="#D4A5E0"/>
    <circle cx="200" cy="225" r="1.5" fill="#E8C5DA"/>
    <circle cx="225" cy="60" r="1.5" fill="#C7B8E0"/>
    <circle cx="100" cy="18" r="1.2" fill="#D4A5E0"/>
    <circle cx="12" cy="115" r="1.2" fill="#E8C5DA"/>
    <circle cx="148" cy="180" r="1.4" fill="#C7B8E0"/>
    <circle cx="190" cy="195" r="1.2" fill="#D4A5E0"/>
  </g>
</svg>
