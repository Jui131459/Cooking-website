<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <g id="flowerLg">
      <g fill="#D4A5E0">
        <ellipse cx="0" cy="-10" rx="6" ry="11"/>
        <ellipse cx="0" cy="-10" rx="6" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#F5D67A"/>
      <circle r="2" fill="#E8B96A"/>
    </g>
    <g id="flowerMd">
      <g fill="#C7B8E0">
        <ellipse cx="0" cy="-7" rx="4.5" ry="8"/>
        <ellipse cx="0" cy="-7" rx="4.5" ry="8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="4.5" ry="8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7" rx="4.5" ry="8" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="4.5" ry="8" transform="rotate(288)"/>
      </g>
      <circle r="2.5" fill="#F5D67A"/>
    </g>
    <g id="flowerSm">
      <g fill="#E8C5DA">
        <circle cx="0" cy="-4" r="3"/>
        <circle cx="0" cy="-4" r="3" transform="rotate(72)"/>
        <circle cx="0" cy="-4" r="3" transform="rotate(144)"/>
        <circle cx="0" cy="-4" r="3" transform="rotate(216)"/>
        <circle cx="0" cy="-4" r="3" transform="rotate(288)"/>
      </g>
      <circle r="1.6" fill="#9B7EBD"/>
    </g>
    <g id="bud">
      <path d="M0,-7 Q-3.5,-2 -2.5,3 Q0,5.5 2.5,3 Q3.5,-2 0,-7 Z" fill="#E8C5DA"/>
      <path d="M0,-3 Q-2,0 -1,3 Q0,4 1,3 Q2,0 0,-3 Z" fill="#D4A5E0" opacity="0.7"/>
      <path d="M-2,4 Q-5,7 -7,6" stroke="#B5C5A8" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    </g>
    <g id="leaf">
      <path d="M0,0 Q6,-4 13,0 Q6,3.5 0,0 Z" fill="#B5C5A8"/>
      <path d="M0.5,0 L12,0" stroke="#8FA481" stroke-width="0.5" fill="none"/>
    </g>
    <g id="leafPair">
      <path d="M0,0 Q-3,-7 -10,-11" stroke="#8FA481" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(-4,-5) rotate(-60) scale(0.9)"/>
      <use href="#leaf" transform="translate(-9,-11) rotate(-115) scale(0.75)"/>
    </g>
    <g id="sprig">
      <path d="M0,0 Q4,-8 2,-18 Q-1,-26 3,-32" stroke="#8FA481" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(3,-6) rotate(40) scale(0.8)"/>
      <use href="#leaf" transform="translate(1,-16) rotate(-130) scale(0.7)"/>
      <use href="#leaf" transform="translate(3,-26) rotate(60) scale(0.65)"/>
    </g>
  </defs>

  <g opacity="0.78">
    <use href="#flowerLg" transform="translate(48,58) rotate(15)"/>
    <use href="#flowerLg" transform="translate(178,172) rotate(-20)"/>
    <use href="#flowerLg" transform="translate(196,42) rotate(40) scale(0.85)"/>
